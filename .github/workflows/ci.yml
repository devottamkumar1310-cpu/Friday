name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build-time only. Real secrets live in the environment, never in the repo.
  AUTH_SECRET: ci-placeholder-secret-at-least-32-chars-long
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        # Includes the dependency-boundary rules (SYSTEM_ARCHITECTURE §9).
        # A violation fails the build rather than waiting for review to catch it.
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: OpenAPI spec is current
        # API_SPECIFICATION §7.4: the published spec is generated from the Zod
        # schemas, so it cannot be allowed to drift from them.
        run: |
          pnpm --filter @friday/contracts generate
          if ! git diff --quiet -- packages/contracts/src/generated; then
            echo "::error::openapi.v1.json is stale. Run 'pnpm --filter @friday/contracts generate' and commit the result."
            git diff --stat -- packages/contracts/src/generated
            exit 1
          fi

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # Stock PostgreSQL: every migration through Phase 2 needs only bundled
        # contrib extensions (DATABASE_DESIGN D11). Switch to
        # pgvector/pgvector:pg16 when the Phase 3 migration introduces
        # memory_chunks — the change is a useful signal in its own right that the
        # project has taken on a third-party infrastructure dependency.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: friday_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/friday_ci
        run: pnpm db:migrate

      - name: Seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/friday_ci
        run: pnpm db:seed

      - name: Migrations are idempotent on re-run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/friday_ci
        run: pnpm db:migrate

      - name: Schema matches the Drizzle definition
        # Catches a hand-edited migration drifting from schema.ts, which would
        # otherwise only surface as a runtime error in a later phase.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/friday_ci
        run: |
          pnpm --filter @friday/db generate
          if ! git diff --quiet -- packages/db/migrations; then
            echo "::error::The Drizzle schema and the committed migrations disagree."
            git diff --stat -- packages/db/migrations
            exit 1
          fi

  e2e:
    name: Browser end-to-end, accessibility, responsive
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: friday_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/friday_e2e
      # The suite drives the app on 127.0.0.1:3100; APP_URL has to agree or the
      # same-origin check in the route handler rejects every mutation.
      APP_URL: http://127.0.0.1:3100
      E2E_PORT: '3100'
      # Recorded responses: no key, no network, no cost, and identical output on
      # every run. The live-provider specs are deliberately not part of this
      # gate — a suite that goes red when a third party rate-limits is a suite
      # people learn to ignore.
      AI_PROVIDER: fixture

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @friday/web e2e:install

      - name: Prepare the database
        run: pnpm db:migrate && pnpm db:seed

      - name: Build
        # A production build, because that is what ships — and because a Phase 3
        # defect (a client boundary importing a Node-only package) passed both
        # typecheck and lint and was caught only by `next build`.
        run: pnpm build

      - name: End-to-end suite
        # Starts `next start` via playwright.config's webServer, then runs the
        # journey (desktop and emulated phone), axe-core over every page, and
        # the responsive matrix.
        run: pnpm e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Known vulnerabilities
        # High and critical fail the build. Moderate and low are reported and
        # triaged rather than blocking every unrelated change — a gate that
        # cries wolf gets disabled, and then it protects nothing.
        run: pnpm audit --audit-level high

      - name: Full advisory report
        if: ${{ !cancelled() }}
        run: pnpm audit || true
